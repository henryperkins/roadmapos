services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roadmapos
      POSTGRES_USER: roadmapos
      POSTGRES_PASSWORD: roadmapos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmapos -d roadmapos"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - roadmapos-postgres:/var/lib/postgresql/data

volumes:
  roadmapos-postgres:
